<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
  <link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        

    <style>
    .general-background {
        background-color: #9a581a;
    }
        .box {
            width: 500px;
            height: 800px;
           margin: 80px auto;
           background-color: #f8eee8;
           padding: 50px 35px 35px;
           box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
           border-color: #861919;
           border-width: 5px;
           border-style: solid;
       }

       .generate-button {
           display: block;
           margin: 30px auto 0;
           background-color: #000000;
           color: #f4f0f0;
           border: none;
           border-radius: 20px;
           padding: 10px 35px;
           font-family: 'Montserrat', sans-serif;
           font-size: 10px;
           letter-spacing: 1px;
           text-transform: uppercase;
           transition: 0.2s;
       }

        .inner{
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            background-color: #e19b72;
            height: 400px;
            padding: 18px;
       }

    </style>
    <title>Document</title>
</head>
<body class="general-background">

<div class="box rounded-5">
        <div class="form-group">

            <div>
                <h1 class="text-center">Element Checker</h1>
                <p class="text-center">Enter the name of a Non-Metal element to check its details.</p>
            </div>
                   <label for="element" class="form-label">Element</label>

                   <input type="text" id="element" class="form-control" placeholder="e.g. Hydrogen">
            </div>
            <br>
            <br>

               <button type="button" py-click="check" class="generate-button">
                   Search Element
               </button>

               <br>

            <div class="inner rounded-3 result">
              <h3>Showcase Result</h3>  
            <br>
            <br>
            <p><b>Non-Element Code:</b><span id="Code"></span></p>
            <br>
            <p><b>Non-Element Name:</b><span id="Name"></span></p>
            <br>
            <p><b>Non-Element Atomic Number:</b><span id="AtomicNumber"></span></p>
            <br>
            <p><b>Non-Element Atomic Mass:</b><span id="AtomicMass"></span></p>
            </div>
     <script type="py" src="main.py"></script>

</body>
</html>
